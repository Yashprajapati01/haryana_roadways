name: Keep Render service awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        run: curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --retry-delay 5 --max-time 20 https://haryana-roadways.onrender.com/health
