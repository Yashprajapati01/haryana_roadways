name: Keep Render service awake

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping Render health endpoint
        run: curl --fail-with-body --silent --show-error --max-time 20 https://haryana-roadways.onrender.com/health
